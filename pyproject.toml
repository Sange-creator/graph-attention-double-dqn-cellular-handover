[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-attention-double-dqn-cellular-handover"
version = "0.1.0"
description = "Graph-Attention Double-DQN for Cellular Handover: A Paired Simulation Evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[project.scripts]
toponet = "toponet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
